<text x="665" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#92400e">hypotheses</text>
<circle cx="627" cy="207" r="6" fill="#f59e0b"/><circle cx="665" cy="207" r="6" fill="#f59e0b"/><circle cx="703" cy="207" r="6" fill="#f59e0b"/>

<line x1="752" y1="172" x2="808" y2="172" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="816" y="72" width="240" height="200" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="936" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#6d28d9">SYSTEM 2</text>
<text x="936" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Selective</text>
<text x="936" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">verification</text>
<text x="936" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">acoustic • linguistic • speaker</text>
<text x="936" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">temporal • activity • multimodal</text>

<line x1="1056" y1="172" x2="1100" y2="172" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
