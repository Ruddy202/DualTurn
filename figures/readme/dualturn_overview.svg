<rect x="292" y="88" width="222" height="168" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<text x="403" y="127" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">SYSTEM 1</text>
<text x="403" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Fast candidate</text>
<text x="403" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">discovery</text>
<text x="403" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">continuous • recall-oriented</text>

<line x1="514" y1="172" x2="570" y2="172" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="578" y="107" width="174" height="130" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
