<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">DualTurn overview</title>
<desc id="desc">Continuous conversation flows through fast candidate discovery, selective verification, confirmed floor transfer, and optional incoming-speaker identification.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
  </marker>
</defs>
<rect width="1200" height="360" rx="24" fill="#f8fafc"/>
<text x="600" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">DualTurn: discovery → verification → floor-transfer interpretation</text>

<rect x="38" y="112" width="190" height="120" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
<text x="133" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Continuous</text>
<text x="133" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">conversation</text>
<path d="M72 207 C94 184,111 221,132 197 C154 174,170 218,195 194" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

