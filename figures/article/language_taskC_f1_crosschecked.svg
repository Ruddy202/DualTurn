<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">VoxConverse TEST frozen Task C event F1 by cross-checked recording language</title>
<desc id="desc">The cross-model agreement groups are English-dominant 123 recordings with 2,139 reference events and F1 0.645, mixed or uncertain 67 with 2,430 events and F1 0.518, and non-English-dominant 34 with 1,779 events and F1 0.488. The non-English minus English F1 difference is -0.158 with whole-recording bootstrap 95% confidence interval -0.208 to -0.104. All 224 saved recording metrics reconcile to 3,609 true positives, 3,122 false positives, and 2,739 false negatives. This is observational, not evidence that language causes the difference.</desc>
